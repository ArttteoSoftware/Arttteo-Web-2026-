name: Build and Deploy arttteo-api

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #################################################
      # PROD
      #################################################

      - name: Set up SSH for PROD
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: SSH into EC2 and deploy container
        env:
          PULL_TOKEN: ${{ secrets.PULL_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "--- CONNECTED TO EC2 ---"
            cd /home/ubuntu/Arttteo-Web-2026-

            echo "--- FIX OWNERSHIP & SAFE GIT DIRECTORY ---"
            sudo chown -R ubuntu:ubuntu .
            git config --global --add safe.directory \$(pwd)

            echo "--- CLEAN & UPDATE REPO ---"
            git reset --hard
            git clean -fd
            git remote set-url origin https://${PULL_TOKEN}@github.com/ArttteoSoftware/Arttteo-Web-2026-.git
            git pull origin main

            echo "--- HOST PERMISSION FIX BEFORE BUILD ---"
            sudo chown -R www-data:www-data storage bootstrap/cache || true
            sudo chmod -R 775 storage bootstrap/cache || true

            echo "--- BUILD & START CONTAINERS ---"
            sudo docker compose up -d --build --no-deps app

            echo "--- WAITING FOR MYSQL TO BE READY ---"
            until sudo docker exec arttteo-mysql mysqladmin ping -u root -proot --silent &> /dev/null; do
              echo "MySQL not ready yet..."
              sleep 2
            done
            echo "MySQL is READY!"

            echo "--- RUNNING LARAVEL COMMANDS INSIDE CONTAINER ---"
            sudo docker exec arttteo-app bash -c "
              set -e
              composer install --no-interaction --prefer-dist &&
              php artisan migrate --force &&
              php artisan optimize:clear &&
              chown -R www-data:www-data storage bootstrap/cache &&
              chmod -R 775 storage bootstrap/cache
            "

            echo "--- SHOW RUNNING CONTAINERS ---"
            sudo docker ps

            echo "--- DEPLOYMENT COMPLETED SUCCESSFULLY ✅ ---"
          EOF
      #################################################
      # TEST
      #################################################

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/test'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy TEST via SSM
        if: github.ref == 'refs/heads/test'
        env:
          INSTANCE_ID: i-0a89911155d6017f0
          PULL_TOKEN: ${{ secrets.PULL_TOKEN }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy arttteo-api TEST" \
            --parameters commands="[
              \"set -e\",
              \"cd /home/ubuntu/Arttteo-Web-2026-\",
              \"chown -R ubuntu:ubuntu .\",
              \"sudo -u ubuntu git config --global --add safe.directory /home/ubuntu/Arttteo-Web-2026-\",
              \"sudo -u ubuntu git remote set-url origin https://${PULL_TOKEN}@github.com/ArttteoSoftware/Arttteo-Web-2026-.git\",
              \"sudo -u ubuntu git fetch origin test\",
              \"sudo -u ubuntu git reset --hard origin/test\",
              \"sudo -u ubuntu git clean -fd -e .env\",
              \"chown -R www-data:www-data storage bootstrap/cache || true\",
              \"chmod -R 775 storage bootstrap/cache || true\",
              \"docker compose --env-file /home/ubuntu/configs/.env up -d --build --no-deps app\",
              \"docker exec arttteo-app bash -lc 'composer install --no-interaction --prefer-dist --no-progress && php artisan migrate --force && php artisan optimize:clear'\",
              \"docker compose --env-file /home/ubuntu/configs/.env ps\"
            ]" \
            --region eu-central-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          sleep 90

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region eu-central-1
